services:
  mysql:
    image: mysql:8.4
    container_name: library-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: library123
      MYSQL_DATABASE: library_db
    ports:
      - "3307:3306"
    volumes:
      - library_mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  library_mysql_data:
